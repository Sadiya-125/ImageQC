[pytest]
asyncio_mode = auto
; The `engine` fixture (and the loaded model) are session-scoped, so the
; event loop must be too -- otherwise pytest-asyncio's default per-test loop
; invalidates the asyncpg connections/engine created in an earlier loop
; ("another operation is in progress" / loop-mismatch errors).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
