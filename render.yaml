# Render Blueprint for the FastAPI backend -- see
# https://render.com/docs/blueprint-spec. Deploy via Render's "New Blueprint
# Instance" flow pointed at this repo; see README.md's "Deployment" section
# for the full step-by-step, including which values to type in for the
# sync:false vars below (Render prompts for these in the dashboard rather
# than reading them from here, so nothing secret is committed).

services:
  - type: web
    name: imageqc-backend
    runtime: docker
    plan: free # Render's free tier (512MB RAM, spins down after 15 min idle -- see README.md §8.3)
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Neon's pooled connection string (via PgBouncer) -- the app's
      # runtime traffic. See core/config.py.
      - key: DATABASE_URL
        sync: false
      # Neon's direct (non-pooled) connection string -- Alembic migrations
      # only, never used by the running app itself.
      - key: DIRECT_URL
        sync: false
      # Comma-separated allowed origins for the deployed Vercel frontend,
      # e.g. https://imageqc.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: MODEL_WEIGHTS_PATH
        sync: false
      - key: ANOMALY_MODEL_PATH
        sync: false
      - key: MAX_UPLOAD_MB
        sync: false
